name: Build Android APK

# Builds an installable APK in the cloud (no Android Studio needed).
# Run it from the Actions tab ("Run workflow"); it also runs on every push that touches the app.
on:
  workflow_dispatch:
  push:
    paths:
      - 'npm-console-android/**'
      - 'npm-progress-pwa/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: npm-console-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 8 compiles with Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already ship the Android SDK and its command-line tools,
      # so no "setup-android" action is needed. Only make sure the exact packages this project uses are there.
      - name: Prepare Android SDK (licenses and the packages this project needs)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME" "$ANDROID_HOME/cmdline-tools" || true
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy the dashboard into the app and sync Capacitor
        run: npm run sync

      - name: Build debug APK
        working-directory: npm-console-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-progress-android-apk
          path: npm-console-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
